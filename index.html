<!DOCTYPE html>
<html lang="en">
<head>
    <link href="assets/css/output.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Petits Plats</title>
    <script type="module" src="assets/js/App.js"></script> 
    <!-- pas besoin d'attribut defer car le type module est déja reporté à la fin du chargement de la page -->
</head>
<body class="font-manrope bg-gray-200">
    <header>
        <div class="text-search-container p-8">
            <h1 class="hidden">Les Petits Plats </h1>
            <img src="assets/icons/Logo.png" alt="logo les petis plats">
            <h2 class="text-amber-300  md:text-2xl lg:text-6xl text-center font-anton lg:mx-64  mt-36">CHERCHEZ PARMI PLUS DE 1500 RECETTES 
                DU QUOTIDIEN, SIMPLES ET DÉLICIEUSES
            </h2>
            <form class=" relative md:flex md:items-center mt-2 max-w-[1482px] mx-auto" id="text-search-form"  action="index.html" method="post">
                <input class="placeholder-mobile input-text-search form-input h-24 px-4 py-3 rounded w-full max-w-[1482px] border-2 focus:ring-0  focus:border-amber-300" placeholder="Rechercher une recette, un ingrédient, ..." id="text" name="text" type="search">
                <label class="hidden" for="text">Text search</label>
                <!-- <button class="form-button px-1 py-3 text-transparent text-xs btn-text-search" type="submit">Search</button> -->
                <div id="suggestions" class="text-white bg-black z-[100] justify-self-start w-[1050px]"></div>
                <img class="delete-text global absolute top-[45px] right-[10px] hidden cursor-pointer" src="assets/icons/close-input.svg" alt="delete text button">
            </form>
        </div>
        <div class="select-search-container px-0 md:px-4 my-6 flex flex-col md:flex-row justify-between w-full max-w-[1510px] mx-auto">
            <form id="filters" action="index.html" method="post" class="flex flex-row  gap-1 md:gap-6 max-w-2xl  ">
                <!-- ul li  -->
                <div class="bg-white w-48 rounded-xl min-h-[3.5rem] max-h-[3.5rem] overflow-hidden relative">
                    <button class="flex p-3 justify-between items-center select-btn h-[3.5rem] text-center w-full text-vw-3 md:text-base" type="button">Ingredients</button>
                    <ul class="flex flex-col tag-container w-full max-h-52 mx-auto text-left relative overflow-y-scroll select-search-ingredients"></ul>
                </div>
                <div class="bg-white w-48 rounded-xl min-h-[3.5rem] max-h-[3.5rem] overflow-hidden ">
                    <button class="flex p-3 justify-between items-center select-btn h-[3.5rem] text-center w-full text-vw-3 md:text-base" type="button">Appareils</button>
                    <ul class="flex flex-col tag-container w-full max-h-52 mx-auto text-left relative overflow-y-scroll select-search-appliances"></ul>
                </div>
                <div class="bg-white w-48 rounded-xl min-h-[3.5rem] max-h-[3.5rem] overflow-hidden ">
                    <button class="flex p-3 justify-between items-center select-btn h-[3.5rem] text-center w-full text-vw-3 md:text-base" type="button">Ustensiles</button>
                    <ul class="flex flex-col tag-container w-full max-h-52 mx-auto text-left relative overflow-y-scroll select-search-ustensils"></ul>
                </div>
                <!-- <button class="form-button px-1 py-3 text-transparent text-xs btn-select-search" type="submit">Search</button> -->
            </form>
            <div class="self-start my-2">
                <p class="font-anton text-xl"><span class="mx-1 total-recipes">50</span><span>recettes</span></p>
            </div>
        </div>
        <div class="label-search-container flex flex-row gap-1 md:px-4 md:gap-6 justify-start max-w-[1510px] mx-auto pb-8">
            <ul class="label-search-ingredients flex flex-col w-[192px] space-y-[10px]"></ul>
            <ul class="label-search-appliances flex flex-col w-[192px] space-y-[10px]"></ul>
            <ul class="label-search-ustensils flex flex-col w-[192px] space-y-[10px]" ></ul>
        </div>
        

    </header>
    <main class="mx-auto">
        <section class="recipes-wrapper flex max-md:flex-col justify-center md:flex-wrap gap-5">
          </section>
    </main>    
</body>
</html>
